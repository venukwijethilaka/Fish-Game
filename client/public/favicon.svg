<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="oceanBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="hatWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Portal / Lifebuoy Gold Border -->
  <circle cx="64" cy="64" r="60" fill="url(#oceanBg)" stroke="url(#goldRim)" stroke-width="6" />

  <!-- Playful Sea Waves in Background -->
  <path d="M12 78 Q28 72 44 78 T76 78 T108 78 T120 78 L120 120 L8 120 Z" fill="#0369a1" opacity="0.4" />
  <path d="M8 88 Q24 82 40 88 T72 88 T104 88 T120 88 L120 120 L8 120 Z" fill="#075985" opacity="0.5" />

  <!-- Sailor Uniform & Collar (Bottom) -->
  <g filter="url(#shadow)">
    <!-- Navy Shirt -->
    <path d="M34 116 Q64 106 94 116 L98 124 L30 124 Z" fill="#1e3a8a" />
    <!-- White Sailor Flap Collar -->
    <path d="M36 108 L48 124 L64 118 L80 124 L92 108 Q64 98 36 108 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
    <!-- Red Neckerchief Ribbon Knot -->
    <path d="M58 114 L64 122 L70 114 L67 110 L61 110 Z" fill="#ef4444" />
    <circle cx="64" cy="113" r="3.5" fill="#dc2626" />
    <path d="M62 116 L59 125 L63 124 Z" fill="#dc2626" />
    <path d="M66 116 L69 125 L65 124 Z" fill="#dc2626" />
  </g>

  <!-- Kid Face & Head -->
  <g filter="url(#shadow)">
    <!-- Cute Ears -->
    <circle cx="34" cy="74" r="7" fill="url(#skin)" stroke="#ea580c" stroke-width="1.2" />
    <circle cx="34" cy="74" r="4" fill="#fbcfe8" />
    <circle cx="94" cy="74" r="7" fill="url(#skin)" stroke="#ea580c" stroke-width="1.2" />
    <circle cx="94" cy="74" r="4" fill="#fbcfe8" />

    <!-- Chubby Kid Face -->
    <ellipse cx="64" cy="74" rx="32" ry="29" fill="url(#skin)" stroke="#ea580c" stroke-width="1.5" />

    <!-- Rosy Cheeks -->
    <ellipse cx="44" cy="80" rx="6.5" ry="4" fill="#fb7185" opacity="0.75" />
    <ellipse cx="84" cy="80" rx="6.5" ry="4" fill="#fb7185" opacity="0.75" />

    <!-- Big Expressive Cartoon Eyes -->
    <!-- Left Eye -->
    <ellipse cx="49" cy="70" rx="6" ry="8" fill="#0f172a" />
    <circle cx="47" cy="67" r="2.8" fill="#ffffff" />
    <circle cx="51.5" cy="73" r="1.3" fill="#ffffff" />

    <!-- Right Eye (Friendly Wink or Happy Gaze) -->
    <ellipse cx="79" cy="70" rx="6" ry="8" fill="#0f172a" />
    <circle cx="77" cy="67" r="2.8" fill="#ffffff" />
    <circle cx="81.5" cy="73" r="1.3" fill="#ffffff" />

    <!-- Cheerful Eyebrows -->
    <path d="M43 60 Q49 56 55 60" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <path d="M73 60 Q79 56 85 60" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cute Button Nose -->
    <path d="M62 73 Q64 76 66 73" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />

    <!-- Big Happy Cartoon Kid Smile -->
    <path d="M52 82 Q64 96 76 82 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5" />
    <!-- Tongue -->
    <path d="M57 88 Q64 85 71 88 Q64 95 57 88 Z" fill="#fb7185" />
  </g>

  <!-- Sailor Hat (Crisp White Dixie Cup with Navy Ribbon & Gold Anchor) -->
  <g filter="url(#shadow)">
    <!-- White Hat Crown (Tilted playfully) -->
    <path d="M30 46 C32 26, 96 26, 98 46 C94 53, 34 53, 30 46 Z" fill="url(#hatWhite)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Top Crown Crease / Fold -->
    <path d="M46 32 Q64 36 82 32" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />

    <!-- Upturned White Brim / Navy Band -->
    <path d="M26 49 C30 38, 98 38, 102 49 C104 57, 24 57, 26 49 Z" fill="#1e3a8a" stroke="#172554" stroke-width="1.5" />
    <path d="M27 49 C31 40, 97 40, 101 49 C99 53, 29 53, 27 49 Z" fill="#ffffff" />

    <!-- Golden Anchor on the Sailor Hat -->
    <circle cx="64" cy="45" r="2.2" fill="#f59e0b" />
    <line x1="64" y1="46" x2="64" y2="53" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
    <line x1="60" y1="48" x2="68" y2="48" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
    <path d="M59 50 Q64 55 69 50" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />

    <!-- Cute Sailor Forelock Hair poking out -->
    <path d="M48 54 Q52 61 56 55 Q60 62 66 54" fill="#92400e" stroke="#78350f" stroke-width="1" />
  </g>

  <!-- Bright Golden Stars / Sparkles for Kid Adventure -->
  <path d="M24 28 L26 22 L28 28 L34 30 L28 32 L26 38 L24 32 L18 30 Z" fill="#fde047" />
  <path d="M102 24 L103.5 19 L105 24 L110 25.5 L105 27 L103.5 32 L102 27 L97 25.5 Z" fill="#fde047" />
</svg>
